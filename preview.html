<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mana Visual Preview</title>
    <style>
      html,
      body {
        width: 488px;
        min-width: 488px;
        min-height: 1px;
        background: #090b14;
      }

      #root[data-preview-reduced="true"] .fill,
      #root[data-preview-reduced="true"] #progress .xpfill {
        transition: none !important;
      }

      #root[data-preview-reduced="true"] .fill::before,
      #root[data-preview-reduced="true"] #progress .xpfill::before,
      #root[data-preview-reduced="true"] #progress .xpfill::after {
        animation: none !important;
      }

      /* Browser stand-in for the native Liquid Glass islands. */
      .glass-island {
        background: rgba(22, 26, 40, 0.88);
      }
    </style>
    <script type="module" src="/src/preview.ts" defer></script>
  </head>
  <body id="preview-root">
    <div id="root">
      <div id="glass" class="glass-island">
        <div id="content">
          <div id="card">
            <section id="card-claude" class="provider-card claude"></section>
            <section id="card-codex" class="provider-card codex"></section>
          </div>
          <div id="progress">
            <span class="level"></span>
            <div class="xpbar"><div class="xpfill"></div></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
